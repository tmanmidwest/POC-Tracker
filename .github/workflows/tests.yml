# Runs the test suite against Postgres — the application's only database. The
# suite migrates a service-container Postgres once and truncates it between tests
# (see tests/conftest.py).
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # ECR Public mirror of the official image — avoids Docker Hub's anonymous
        # pull rate limit that flakes CI on shared GitHub-runner IPs.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: poct
          POSTGRES_PASSWORD: poct
          POSTGRES_DB: poct
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poct -d poct"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POCT_DATABASE_URL: postgresql+psycopg://poct:poct@localhost:5432/poct

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # WeasyPrint (PDF reports) needs Pango/Cairo native libraries at import time.
      - name: Install native libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core

      - name: Install the project (with dev + mcp extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Run the test suite
        run: pytest -q
